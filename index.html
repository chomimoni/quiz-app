<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クイズ暗記">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1A3A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<title>クイズ暗記</title>
<style>
:root{--ink:#1B1A3A;--yel:#FFD23F;--cor:#FF5C7A;--mint:#2EE6A6;--cloud:#F6F4FF;--line:#1B1A3A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500;background:var(--ink);color:var(--ink);
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-weight:900;font-size:34px;line-height:1.15;margin:0;color:var(--yel);letter-spacing:.02em}
h2{font-weight:900;font-size:20px;margin:0 0 12px}
.sub{color:#cfcbff;margin:6px 0 22px}
.panel{background:var(--cloud);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--cor);margin-bottom:26px}
label{display:block;font-weight:900;margin:12px 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff}
input:focus-visible,button:focus-visible{outline:4px solid var(--mint);outline-offset:2px}
button{font:inherit;font-weight:900;cursor:pointer;border:3px solid var(--line);border-radius:16px;padding:12px 18px;background:var(--yel);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.wide{width:100%;margin-top:18px;font-size:18px}
button.ghost{background:transparent;color:var(--cloud);border-color:var(--cloud);box-shadow:none;padding:8px 14px;font-size:14px}
button.small{padding:6px 12px;font-size:13px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.msg{min-height:1.4em;margin:12px 0 0;font-weight:900;color:#b3002a}
.msg.ok{color:#00794f}
.set{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--mint)}
.set b{font-size:18px;display:block;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.tag{border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:900;background:var(--yel)}
.tag.priv{background:#e4e0ff}
.empty{color:#cfcbff;border:3px dashed #6b67b3;border-radius:18px;padding:22px;text-align:center}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:900}
.chk input{width:24px;height:24px;accent-color:var(--cor)}
textarea,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}
.row input[type=radio]{width:24px;height:24px;accent-color:var(--cor);flex:none}
.row input[type=text]{flex:1}
.choice{display:block;width:100%;margin-top:12px;text-align:left;background:#fff;font-size:17px}
.choice.skip{background:#e4e0ff;font-size:14px;text-align:center}
button:disabled{opacity:.55;cursor:default}
.choice:disabled{opacity:.55;cursor:default}
#qFeedback{font-size:24px;font-weight:900}
#qFeedback.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#qFeedback.pop{animation:none}}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="loginView" class="hidden">
  <h1>クイズ暗記</h1>
  <p class="sub">招待された人だけが入れます。</p>
  <div class="panel" id="loginPanel">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="loginBtn" class="wide">ログインする</button>
    <p id="loginMsg" class="msg" role="alert"></p>
    <button id="toSignup" class="small" style="margin-top:8px">はじめての人はこちら</button>
  </div>
  <div class="panel hidden" id="signupPanel">
    <h2>新しく登録する</h2>
    <label for="suName">ニックネーム</label>
    <input id="suName" type="text" maxlength="20" autocomplete="nickname">
    <label for="suEmail">メールアドレス</label>
    <input id="suEmail" type="email" autocomplete="email" inputmode="email">
    <label for="suPw">パスワード(8文字以上)</label>
    <input id="suPw" type="password" autocomplete="new-password">
    <label for="suCode">招待コード</label>
    <input id="suCode" type="text" autocomplete="off" autocapitalize="off">
    <button id="suBtn" class="wide">登録する</button>
    <p id="suMsg" class="msg" role="alert"></p>
    <button id="toLogin" class="small" style="margin-top:8px">ログインにもどる</button>
  </div>
</section>

<section id="homeView" class="hidden">
  <div class="top">
    <div>
      <h1 id="hello">ホーム</h1>
      <p class="sub" id="roleLine"></p>
    </div>
    <button id="logoutBtn" class="ghost">ログアウト</button>
  </div>

  <button id="reviewBtn" class="wide" style="margin-top:0;margin-bottom:26px;background:var(--mint)" disabled>復習する</button>

  <div class="panel">
    <h2>問題集をつくる</h2>
    <label for="newTitle">タイトル</label>
    <input id="newTitle" type="text" maxlength="60">
    <label class="chk"><input id="newPublic" type="checkbox"> みんなに公開する</label>
    <label class="chk"><input id="newContrib" type="checkbox"> 他の人も問題を追加できる(公開のとき)</label>
    <button id="createBtn" class="wide">つくる</button>
    <p id="createMsg" class="msg" role="status"></p>
  </div>

  <h2 style="color:var(--yel)">問題集</h2>
  <div id="list"></div>
</section>

<section id="setView" class="hidden">
  <button id="backHome" class="ghost">もどる</button>
  <h1 id="setTitle" style="margin-top:14px"></h1>
  <p class="sub" id="setInfo"></p>
  <button id="playBtn" class="wide" style="margin-top:0;margin-bottom:26px">クイズをはじめる</button>

  <div id="ownerPanel" class="panel hidden">
    <h2>この問題集の設定</h2>
    <label class="chk"><input id="setPublic" type="checkbox"> みんなに公開する</label>
    <label class="chk"><input id="setContrib" type="checkbox"> 他の人も問題を追加できる(公開のとき)</label>
    <p id="setMsg" class="msg" role="status"></p>
  </div>

  <div id="addPanel" class="panel">
    <h2>問題を追加する</h2>
    <label for="qType">形式</label>
    <select id="qType"><option value="single">単一選択</option><option value="multiple">複数選択</option><option value="truefalse">正誤</option><option value="fill">穴埋め</option><option value="ordering">並べ替え</option><option value="matching">マッチング</option><option value="word">単語</option></select>
    <label for="qBodyIn">問題文</label>
    <textarea id="qBodyIn" maxlength="500"></textarea>
    <div id="fSingle">
      <label id="optLabel">選択肢(正解にチェック・2つ以上)</label>
      <div class="row"><input type="radio" name="sc" value="0" checked><input type="text" id="o0" placeholder="選択肢1"></div>
      <div class="row"><input type="radio" name="sc" value="1"><input type="text" id="o1" placeholder="選択肢2"></div>
      <div class="row"><input type="radio" name="sc" value="2"><input type="text" id="o2" placeholder="選択肢3"></div>
      <div class="row"><input type="radio" name="sc" value="3"><input type="text" id="o3" placeholder="選択肢4"></div>
    </div>
    <div id="fTf" class="hidden">
      <label>正解</label>
      <div class="row"><input type="radio" name="tf" value="true" checked> 正しい</div>
      <div class="row"><input type="radio" name="tf" value="false"> 誤り</div>
    </div>
    <div id="fFill" class="hidden">
      <label for="fillAns">正解(別の書き方も正解にするなら , で区切る)</label>
      <input type="text" id="fillAns">
    </div>
    <div id="fOrd" class="hidden">
      <label for="ordText">正しい順に、1行に1つ(2〜6個)</label>
      <textarea id="ordText"></textarea>
    </div>
    <div id="fMatch" class="hidden">
      <label for="matchText">1行に1組、「左 = 右」の形(2〜6組)</label>
      <textarea id="matchText" placeholder="例:心臓 = 血液を送り出す"></textarea>
    </div>
    <div id="fWord" class="hidden">
      <label for="meaningIn">意味(答え)。問題文には単語を入れる</label>
      <input type="text" id="meaningIn" maxlength="300">
    </div>
    <label for="qExpIn">解説(なくてもOK)</label>
    <input type="text" id="qExpIn" maxlength="300">
    <button id="addQBtn" class="wide">追加する</button>
    <p id="addMsg" class="msg" role="status"></p>
  </div>

  <h2 style="color:var(--yel)">問題一覧</h2>
  <div id="qList"></div>
</section>

<section id="quizView" class="hidden">
  <div class="top"><p class="sub" id="progress"></p><button id="quitBtn" class="ghost">ホームへ</button></div>
  <div class="panel">
    <h2 id="qBody"></h2>
    <div id="qAnswer"></div>
    <p id="qFeedback" class="msg" role="status"></p>
    <p id="qExp"></p>
  </div>
  <button id="nextBtn" class="wide hidden">次へ</button>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://swxxphiqzwnpbkgzlhfe.supabase.co";
const SUPABASE_KEY = "sb_publishable_Qh6o1Oy5vppxrsnPTHhCEw_OPwOW8Cx";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null, profile = null;

function show(view){
  ["login","home","set","quiz"].forEach(n => $(n + "View").classList.toggle("hidden", n !== view));
  window.scrollTo(0, 0);
}

async function boot(){
  const { data } = await db.auth.getSession();
  if (data.session) await enter(data.session.user); else show("login");
}

async function enter(user){
  me = user;
  const { data } = await db.from("profiles").select("display_name,is_admin").eq("id", user.id).single();
  profile = data || { display_name: "ゲスト", is_admin: false };
  $("hello").textContent = profile.display_name + "さん";
  $("roleLine").textContent = profile.is_admin ? "管理者(他の人の非公開も閲覧のみ可)" : "今日も1問ずつ覚えよう";
  show("home");
  loadSets();
}

$("loginBtn").onclick = async () => {
  const msg = $("loginMsg"); msg.textContent = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if (error) { msg.textContent = "ログインできません。メールとパスワードを確認してください。"; return; }
  $("pw").value = "";
  enter(data.user);
};

function swapAuth(toSignup){
  $("loginPanel").classList.toggle("hidden", toSignup);
  $("signupPanel").classList.toggle("hidden", !toSignup);
}
$("toSignup").onclick = () => swapAuth(true);
$("toLogin").onclick = () => swapAuth(false);

$("suBtn").onclick = async () => {
  const msg = $("suMsg"); msg.className = "msg"; msg.textContent = "";
  const name = $("suName").value.trim(), email = $("suEmail").value.trim(), pw = $("suPw").value, code = $("suCode").value.trim();
  if (!name || !email || !code) { msg.textContent = "ニックネーム・メール・招待コードを入力してください。"; return; }
  if (pw.length < 8) { msg.textContent = "パスワードは8文字以上にしてください。"; return; }
  const { data, error } = await db.auth.signUp({ email, password: pw, options: { data: { display_name: name, invite_code: code } } });
  if (error) { msg.textContent = "登録できませんでした。招待コードが違うか、使える回数・期限が切れています。メールアドレスが登録済みの可能性もあります。"; return; }
  $("suPw").value = ""; $("suCode").value = "";
  if (data.session) { enter(data.user); }
  else { msg.className = "msg ok"; msg.textContent = "登録しました。届いたメールの確認をしてからログインしてください。"; }
};

$("logoutBtn").onclick = async () => { await db.auth.signOut(); me = null; show("login"); };

async function loadSets(){
  updateReview();
  const list = $("list"); list.replaceChildren();
  const { data, error } = await db.from("quiz_sets")
    .select("id,title,is_public,allow_contrib,owner_id,profiles(display_name)")
    .order("created_at", { ascending: false });
  if (error) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "読み込めませんでした。画面を引き下げて更新してください。"; list.append(p); return; }
  if (!data.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "まだ問題集がありません。上のフォームから最初の1つをつくろう。"; list.append(p); return; }
  for (const s of data) {
    const card = document.createElement("div"); card.className = "set";
    const t = document.createElement("b"); t.textContent = s.title;
    const meta = document.createElement("div"); meta.className = "meta";
    const tag = document.createElement("span"); tag.className = "tag" + (s.is_public ? "" : " priv"); tag.textContent = s.is_public ? "公開" : "非公開";
    const who = document.createElement("span");
    who.textContent = s.owner_id === me.id ? "自分の問題集" : "作成: " + (s.profiles?.display_name || "不明");
    meta.append(tag, who);
    if (s.owner_id === me.id) {
      const del = document.createElement("button"); del.className = "small"; del.textContent = "削除";
      del.onclick = async () => {
        if (!confirm("「" + s.title + "」を削除しますか?中の問題も消えます。")) return;
        await db.from("quiz_sets").delete().eq("id", s.id); loadSets();
      };
      meta.append(del);
    }
    const open = document.createElement("button"); open.className = "small"; open.textContent = "開く";
    open.onclick = () => openSet(s); meta.prepend(open);
    const play = document.createElement("button"); play.className = "small"; play.style.background = "var(--yel)"; play.textContent = "あそぶ";
    play.onclick = () => playSet(s); meta.prepend(play);
    card.append(t, meta); list.append(card);
  }
}

$("createBtn").onclick = async () => {
  const msg = $("createMsg"); msg.className = "msg"; msg.textContent = "";
  const title = $("newTitle").value.trim();
  if (!title) { msg.textContent = "タイトルを入力してください。"; return; }
  const { error } = await db.from("quiz_sets").insert({ title, is_public: $("newPublic").checked, allow_contrib: $("newContrib").checked });
  if (error) { msg.textContent = "つくれませんでした。もう一度試してください。"; return; }
  $("newTitle").value = ""; $("newPublic").checked = false; $("newContrib").checked = false;
  msg.className = "msg ok"; msg.textContent = "つくりました。";
  loadSets();
};

let curSet = null, curQs = [], qs = [], qi = 0, score = 0, finished = false;
const TYPE_NAME = { single: "単一選択", multiple: "複数選択", truefalse: "正誤", fill: "穴埋め", ordering: "並べ替え", matching: "マッチング", word: "単語" };
function correctText(q){
  const c = q.content;
  if (q.type === "single") return c.options[c.answer];
  if (q.type === "truefalse") return c.answer ? "正しい" : "誤り";
  if (q.type === "fill") return c.answers[0];
  if (q.type === "multiple") return c.answers.map(i => c.options[i]).join("、");
  if (q.type === "ordering") return c.items.join(" → ");
  if (q.type === "matching") return c.pairs.map(p => p[0] + " = " + p[1]).join("、");
  return c.meaning;
}
const norm = s => String(s).trim().normalize("NFKC").toLowerCase();

function openSet(s){
  curSet = s;
  $("setTitle").textContent = s.title;
  $("setInfo").textContent = s.owner_id === me.id ? "自分の問題集" : "作成: " + (s.profiles?.display_name || "不明");
  const isOwner = s.owner_id === me.id;
  $("ownerPanel").classList.toggle("hidden", !isOwner);
  $("setPublic").checked = !!s.is_public; $("setContrib").checked = !!s.allow_contrib; $("setMsg").textContent = "";
  $("addPanel").classList.toggle("hidden", !(isOwner || (s.is_public && s.allow_contrib)));
  $("addMsg").textContent = "";
  show("set"); loadQs();
}
$("backHome").onclick = () => { show("home"); loadSets(); };

async function loadQs(){
  const box = $("qList"); box.replaceChildren();
  const { data, error } = await db.from("questions").select("*,profiles(display_name)").eq("set_id", curSet.id).order("created_at");
  curQs = data || [];
  $("playBtn").disabled = !curQs.length;
  if (error || !curQs.length) {
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = error ? "読み込めませんでした。" : "まだ問題がありません。";
    box.append(p); return;
  }
  for (const q of curQs) {
    const card = document.createElement("div"); card.className = "set";
    const b = document.createElement("b"); b.textContent = q.body;
    const meta = document.createElement("div"); meta.className = "meta";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = TYPE_NAME[q.type] || q.type;
    meta.append(tag);
    if (q.created_by && q.created_by !== me.id) {
      const w = document.createElement("span"); w.textContent = "追加: " + (q.profiles?.display_name || "不明"); meta.append(w);
    }
    if (curSet.owner_id === me.id || q.created_by === me.id) {
      const del = document.createElement("button"); del.className = "small"; del.textContent = "削除";
      del.onclick = async () => { if (!confirm("この問題を削除しますか?")) return; await db.from("questions").delete().eq("id", q.id); loadQs(); };
      meta.append(del);
    }
    card.append(b, meta); box.append(card);
  }
}

$("qType").onchange = () => {
  const t = $("qType").value;
  const multi = t === "multiple";
  $("fSingle").classList.toggle("hidden", t !== "single" && !multi);
  document.querySelectorAll('input[name="sc"]').forEach(e => e.type = multi ? "checkbox" : "radio");
  $("optLabel").textContent = multi ? "選択肢(正解すべてにチェック)" : "選択肢(正解にチェック・2つ以上)";
  $("fTf").classList.toggle("hidden", t !== "truefalse");
  $("fFill").classList.toggle("hidden", t !== "fill");
  $("fOrd").classList.toggle("hidden", t !== "ordering");
  $("fMatch").classList.toggle("hidden", t !== "matching");
  $("fWord").classList.toggle("hidden", t !== "word");
};

$("addQBtn").onclick = async () => {
  const msg = $("addMsg"); msg.className = "msg"; msg.textContent = "";
  const type = $("qType").value, body = $("qBodyIn").value.trim();
  if (!body) { msg.textContent = "問題文を入力してください。"; return; }
  let content;
  if (type === "single") {
    const opts = [0,1,2,3].map(i => $("o" + i).value.trim());
    const ans = Number(document.querySelector('input[name="sc"]:checked').value);
    const filled = opts.filter(Boolean);
    if (filled.length < 2) { msg.textContent = "選択肢を2つ以上入力してください。"; return; }
    if (!opts[ans]) { msg.textContent = "正解にチェックした選択肢が空です。"; return; }
    content = { options: filled, answer: opts.slice(0, ans).filter(Boolean).length };
  } else if (type === "truefalse") {
    content = { answer: document.querySelector('input[name="tf"]:checked').value === "true" };
  } else if (type === "fill") {
    const answers = $("fillAns").value.split(",").map(s => s.trim()).filter(Boolean);
    if (!answers.length) { msg.textContent = "正解を入力してください。"; return; }
    content = { answers };
  } else if (type === "multiple") {
    const opts = [0,1,2,3].map(i => $("o" + i).value.trim());
    const chk = [...document.querySelectorAll('input[name="sc"]:checked')].map(e => Number(e.value));
    const filled = opts.filter(Boolean);
    if (filled.length < 2) { msg.textContent = "選択肢を2つ以上入力してください。"; return; }
    if (!chk.length || chk.some(i => !opts[i])) { msg.textContent = "正解を1つ以上チェックしてください(空の選択肢は選べません)。"; return; }
    content = { options: filled, answers: chk.map(i => opts.slice(0, i).filter(Boolean).length) };
  } else if (type === "ordering") {
    const items = $("ordText").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (items.length < 2 || items.length > 6) { msg.textContent = "2〜6個、1行に1つずつ入力してください。"; return; }
    content = { items };
  } else if (type === "matching") {
    const pairs = $("matchText").value.split("\n").map(l => l.replace("\uFF1D", "=").split("=").map(s => s.trim())).filter(p => p.length === 2 && p[0] && p[1]);
    if (pairs.length < 2 || pairs.length > 6) { msg.textContent = "「左 = 右」の形で、2〜6組入力してください。"; return; }
    content = { pairs };
  } else {
    const meaning = $("meaningIn").value.trim();
    if (!meaning) { msg.textContent = "意味を入力してください。"; return; }
    content = { meaning };
  }
  const { error } = await db.from("questions").insert({ set_id: curSet.id, type, body, explanation: $("qExpIn").value.trim() || null, content });
  if (error) { msg.textContent = "追加できませんでした。もう一度試してください。"; return; }
  ["qBodyIn","o0","o1","o2","o3","fillAns","qExpIn","ordText","matchText","meaningIn"].forEach(id => $(id).value = "");
  msg.className = "msg ok"; msg.textContent = "追加しました。";
  loadQs();
};

$("playBtn").onclick = () => {
  reviewMode = false; quizFrom = "set";
  qs = [...curQs].sort(() => Math.random() - .5); qi = 0; score = 0; finished = false;
  show("quiz"); renderQ();
};
function leaveQuiz(){ if (reviewMode || quizFrom === "home") { show("home"); loadSets(); } else { show("set"); loadQs(); } }
$("quitBtn").onclick = () => { show("home"); loadSets(); };
$("nextBtn").onclick = () => { if (finished) leaveQuiz(); else { qi++; renderQ(); } };

function renderQ(){
  const ans = $("qAnswer"); ans.replaceChildren();
  $("qFeedback").textContent = ""; $("qFeedback").className = "msg"; $("qExp").textContent = "";
  $("nextBtn").classList.add("hidden");
  if (qi >= qs.length) {
    finished = true;
    $("progress").textContent = "おつかれさま";
    $("qBody").textContent = "結果";
    $("qFeedback").className = "msg ok pop";
    $("qFeedback").textContent = qs.length + "問中 " + score + "問 正解";
    $("nextBtn").textContent = (reviewMode || quizFrom === "home") ? "ホームにもどる" : "問題集にもどる"; $("nextBtn").classList.remove("hidden");
    return;
  }
  const q = qs[qi], c = q.content;
  $("progress").textContent = (qi + 1) + " / " + qs.length;
  $("qBody").textContent = q.body;
  $("nextBtn").textContent = qi + 1 < qs.length ? "次へ" : "結果を見る";
  const mk = (label, fn, cls) => { const b = document.createElement("button"); b.className = "choice " + (cls || ""); b.textContent = label; b.onclick = fn; ans.append(b); return b; };
  if (q.type === "single") {
    c.options.forEach((o, i) => mk(o, () => judge(q, i === c.answer, c.options[c.answer])));
  } else if (q.type === "truefalse") {
    mk("正しい", () => judge(q, c.answer === true, c.answer ? "正しい" : "誤り"));
    mk("誤り", () => judge(q, c.answer === false, c.answer ? "正しい" : "誤り"));
  } else if (q.type === "fill") {
    const inp = document.createElement("input"); inp.type = "text"; inp.setAttribute("aria-label", "答え"); ans.append(inp);
    mk("答える", () => judge(q, c.answers.map(norm).includes(norm(inp.value)), c.answers[0]));
  } else if (q.type === "multiple") {
    const picked = new Set();
    c.options.forEach((o, i) => { const b = mk(o, () => {
      if (picked.has(i)) picked.delete(i); else picked.add(i);
      b.style.background = picked.has(i) ? "var(--yel)" : "#fff";
    }); });
    mk("これで答える", () => judge(q, picked.size === c.answers.length && c.answers.every(i => picked.has(i)), correctText(q))).style.background = "var(--mint)";
  } else if (q.type === "ordering") {
    const order = [], items = c.items.map((t, i) => ({ t, i })).sort(() => Math.random() - .5);
    const line = document.createElement("p"); line.style.fontWeight = "900"; line.textContent = "正しい順にタップ"; ans.append(line);
    const btns = items.map(it => { const b = mk(it.t, () => {
      order.push(it.i); b.disabled = true;
      line.textContent = order.map(i => c.items[i]).join(" → ");
      if (order.length === items.length) judge(q, order.every((v, k) => v === k), correctText(q));
    }); return b; });
    mk("やりなおす", () => { order.length = 0; btns.forEach(b => b.disabled = false); line.textContent = "正しい順にタップ"; }, "skip");
  } else if (q.type === "matching") {
    const R = c.pairs.map((p, i) => ({ t: p[1], i })).sort(() => Math.random() - .5);
    let sel = null, done = 0, allOk = true;
    const info = document.createElement("p"); info.style.fontWeight = "900"; info.textContent = "左を選んで、合う右を選ぶ"; ans.append(info);
    const lb = c.pairs.map((p, i) => mk(p[0], () => {
      if (sel !== null) lb[sel].style.background = "#fff";
      sel = i; lb[i].style.background = "var(--yel)";
    }));
    R.forEach(r => { const b = mk("→ " + r.t, () => {
      if (sel === null) return;
      const ok = sel === r.i; if (!ok) allOk = false;
      lb[sel].disabled = true; b.disabled = true;
      lb[sel].style.background = b.style.background = ok ? "var(--mint)" : "var(--cor)";
      sel = null; done++;
      if (done === c.pairs.length) judge(q, allOk, correctText(q));
    }); });
    const grid = document.createElement("div"); grid.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:start";
    const colL = document.createElement("div"), colR = document.createElement("div"); grid.append(colL, colR);
    [...ans.querySelectorAll("button.choice")].forEach(b => { b.style.fontSize = "15px"; (lb.includes(b) ? colL : colR).append(b); });
    ans.append(grid);
  } else if (q.type === "word") {
    mk("答えを見る", () => {
      ans.replaceChildren();
      const m = document.createElement("p"); m.style.cssText = "font-size:22px;font-weight:900"; m.textContent = c.meaning; ans.append(m);
      mk("覚えてた", () => judge(q, true, c.meaning));
      mk("まだ覚えてない", () => judge(q, false, c.meaning), "skip");
    });
  }
  mk("わからない", () => judge(q, null, correctText(q)), "skip");
}

async function judge(q, ok, correctText){
  $("qAnswer").querySelectorAll("button,input").forEach(e => e.disabled = true);
  if (ok) score++;
  const fb = $("qFeedback");
  fb.className = "msg pop" + (ok ? " ok" : "");
  fb.textContent = ok ? "正解!" : (ok === null ? "わからない → 正解は「" : "ざんねん → 正解は「") + correctText + "」";
  $("qExp").textContent = q.explanation || "";
  $("nextBtn").classList.remove("hidden");
  await db.from("attempts").insert({ question_id: q.id, result: ok === null ? "unsure" : ok ? "correct" : "wrong" });
}

async function saveSetting(){
  const pub = $("setPublic").checked, con = $("setContrib").checked, msg = $("setMsg");
  const { error } = await db.from("quiz_sets").update({ is_public: pub, allow_contrib: con }).eq("id", curSet.id);
  if (error) { msg.className = "msg"; msg.textContent = "保存できませんでした。もう一度試してください。"; return; }
  curSet.is_public = pub; curSet.allow_contrib = con;
  msg.className = "msg ok";
  msg.textContent = con && !pub ? "保存しました。他の人が追加できるのは、公開にしたときです。" : "保存しました。";
}
$("setPublic").onchange = saveSetting; $("setContrib").onchange = saveSetting;

let reviewMode = false, reviewIds = [], quizFrom = "set";

async function playSet(s){
  const { data, error } = await db.from("questions").select("*").eq("set_id", s.id);
  if (error || !data.length) { alert(error ? "読み込めませんでした。" : "この問題集には、まだ問題がありません。"); return; }
  curSet = s; reviewMode = false; quizFrom = "home";
  qs = [...data].sort(() => Math.random() - .5); qi = 0; score = 0; finished = false;
  show("quiz"); renderQ();
}

async function updateReview(){
  const { data } = await db.from("attempts").select("question_id,result").order("created_at", { ascending: false }).limit(1000);
  const seen = new Set(); reviewIds = [];
  for (const a of data || []) {
    if (seen.has(a.question_id)) continue;
    seen.add(a.question_id);
    if (a.result !== "correct") reviewIds.push(a.question_id);
  }
  const b = $("reviewBtn");
  b.textContent = reviewIds.length ? "復習する(" + reviewIds.length + "問)" : "復習する";
  b.disabled = !reviewIds.length;
}

$("reviewBtn").onclick = async () => {
  const { data } = await db.from("questions").select("*").in("id", reviewIds);
  if (!data || !data.length) { alert("復習する問題がありません。"); return; }
  reviewMode = true;
  qs = [...data].sort(() => Math.random() - .5); qi = 0; score = 0; finished = false;
  show("quiz"); renderQ();
};

boot();
</script>
